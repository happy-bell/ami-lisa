<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>住所録</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- jQuery UI CSS -->
  <link href="/assets/css/jquery-ui.css" rel="stylesheet" />
  <!-- Bootstrap CSS -->
  <link href="/assets/css/bootstrap.css" rel="stylesheet">
  <!-- font icon -->
  <link href="/assets/css/font-awesome.min.css" rel="stylesheet">
  <!-- style -->
  <link href="/assets/css/style.css" rel="stylesheet"/>

  <style>
    #contents {
      margin-top: 10px;
    }
  </style>
</head>
<body class="color-dark menu-top">

<header class="navbar">
  <div class="container-fluid">
    <div class="navbar-header">
      <a class="navbar-brand" href="/">テレナス</a>
    </div>
  </div>
</header>

<ol class="breadcrumb border-flat" style="margin-bottom: 0;">
  <li><a href="/">メニュー</a></li>
  <li class="active">住所録</li>
</ol>

<div id="contents">

  <div class="page-header" style="margin-top: 0;">
    <div class="container-fluid">
      <div class="row">
        <h4 class="page-header-title" style="margin-top: 5px;">住所録</h4>
        <div class="btn-toolbar">
          <div class="btn-group">
            <form id="form1" method="get" action="/admin/address_list">
              <input type="hidden" name="mcs" value="1">
              <button class="btn btn-default btn-sm toggle btn-3d" type="submit">
                MCS設定取得
              </button>
            </form>
            <form id="form2" method="post" action="/admin/update_address">
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="container-fluid">

    <div class="row">
      <div class="col-xs-12">

        <table class="table table-bordered" style="max-width: 800px;">
          <thead>
          <tr>
            <th>グループ</th>
            <th>ID</th>
            <th>名前</th>
          </tr>
          </thead>
          <tbody id="tbody1">
          <% for (var i = 0; i < address.length; i++) { %>
          <tr>
            <td><%= address[i]['BOOK_GRP'] %></td>
            <td><%= address[i]['TARGET_ID'] %></td>
            <td><%= address[i]['NAME'] %></td>
          </tr>
          <% } %>
          </tbody>
        </table>

      </div>
    </div>

  </div>

</div>

<!-- javascript -->
<script type="text/javascript">
  var mcs = '<%= mcs %>';
</script>
<script src="/assets/js/jquery.js"></script>
<script src="/assets/js/jquery-ui.min.js"></script>
<script src="/assets/js/bootstrap.js"></script>
<script src="/assets/js/app.js"></script>
<script src="/js/admin/address_list.js"></script>

</body>
</html>
