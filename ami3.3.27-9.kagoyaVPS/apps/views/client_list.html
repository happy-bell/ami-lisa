<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>セッション</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- jQuery UI CSS -->
  <link href="/assets/css/jquery-ui.css" rel="stylesheet" />
  <!-- Bootstrap CSS -->
  <link href="/assets/css/bootstrap.css" rel="stylesheet">
  <!-- font icon -->
  <link href="/assets/css/font-awesome.min.css" rel="stylesheet">
  <!-- style -->
  <link href="/assets/css/style.css" rel="stylesheet"/>

  <style>
    #contents {
      margin-top: 10px;
    }
  </style>
</head>
<body class="color-dark menu-top">

<header class="navbar">
  <div class="container-fluid">
    <div class="navbar-header">
      <a class="navbar-brand" href="/admin">テレナス</a>
    </div>
  </div>
</header>

<ol class="breadcrumb border-flat" style="margin-bottom: 0;">
  <li><a href="/">メニュー</a></li>
  <li class="active">セッション</li>
</ol>

<div id="contents">

  <div class="page-header" style="margin-top: 0;">
    <div class="container-fluid">
      <div class="row">
        <h4 class="page-header-title" style="margin-top: 5px;">セッション</h4>
        <div class="btn-toolbar">
          <div class="btn-group">
            <a id="update-button" class="btn btn-default btn-sm toggle btn-3d">
              更新
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="container-fluid">

    <div class="row">
      <div class="col-xs-12">

        <table class="table table-bordered" style="max-width: 800px;">
          <thead>
          <tr>
            <th>グループ</th>
            <th>ID</th>
            <th>状態</th>
          </tr>
          </thead>
          <tbody id="tbody1"></tbody>
        </table>

      </div>
    </div>

  </div>

</div>


<!-- javascript -->
<script src="/assets/js/jquery.js"></script>
<script src="/assets/js/jquery-ui.min.js"></script>
<script src="/assets/js/bootstrap.js"></script>
<script src="/assets/js/app.js"></script>
<script src="/socket.io/socket.io.js"></script>

<script>

  jQuery(function($) {

    function init() {
      setupIO();
      getData();
    }

    function setupIO() {
      io.connect()
          .on('worker_id', function(data) {
            console.log(data);
          })
          .on('login', function(data) {
            getData();
          })
          .on('status_change', function(data) {
            getData();
          });
    }

    function getData() {
      app.get('/clients_info', {}).done(function(data) {
        addTableRow(data);
      });
    }

    function addTableRow(items) {
      $('#tbody1').html('');
      var item, tr = '';
      for (var k in items) {
        item = items[k];
        tr = tr +
            '<tr>' +
            '<td>' + item.group + '</td>' +
            '<td>' + k + '</td>' +
            '<td>' + item.status + '</td>' +
            '</tr>';
      }
      $('#tbody1').html(tr);
    }

    function statusText(val) {

    }

    $('#update-button').click(function() {
      getData();
    });

    init();

  });
</script>

</body>
</html>
