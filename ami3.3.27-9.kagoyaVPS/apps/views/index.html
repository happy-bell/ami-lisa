<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Menu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- jQuery UI CSS -->
  <link rel="stylesheet" href="/assets/css/jquery-ui.css" />
  <!-- Bootstrap CSS -->
  <link href="/assets/css/bootstrap.css" rel="stylesheet">
  <!-- font icon -->
  <link href="/assets/css/font-awesome.min.css" rel="stylesheet">
  <!-- style -->
  <link href="/assets/css/style.css" rel="stylesheet"/>


  <style>
    #menu-panel {
      max-width: 600px;
    }

    #menu-table td {
      padding: 4px;
      width: 260px;
    }

    #menu-table td a {
      display: block;
    }
  </style>
</head>
<body>


<header class="navbar">
  <div class="container-fluid">
    <div class="navbar-header">
      <a class="navbar-brand" href="/admin">テレナス</a>
    </div>
  </div>
</header>

<div id="contents">
  <div id="menu-panel" class="well">

    <div class="panel-body">
      <table id="menu-table">
        <tbody>
        <tr>
          <td>
            <a class="btn btn-default btn-lg btn-3d" href="/admin/client_list">セッション</a>
          </td>
          <td>
          </td>
        </tr>
        <tr>
          <td>
            <a class="btn btn-default btn-lg btn-3d" href="/admin/callbutton_list">コールボタン</a>
          </td>
          <td>
            <a class="btn btn-default btn-lg btn-3d" href="/admin/push_list">PUSH通知</a>
          </td>
        </tr>
        <tr>
          <td>
            <button id="reboot-btn" type="button" class="btn btn-default btn-lg btn-3d">再起動</button>
          </td>
          <td>
          </td>
        </tr>
        </tbody>
      </table>

    </div>
  </div>
</div>

<!-- javascript -->
<script src="/assets/js/jquery.js"></script>
<script src="/assets/js/jquery-ui.min.js"></script>
<script src="/assets/js/bootstrap.js"></script>
<script src="/assets/js/app.js"></script>
<script>
  jQuery(function($) {
    $('#reboot-btn').click(function() {
      if (!confirm('再起動してもよろしいですか？')) {
        return false;
      }
      app.get('/reboot/hP5ppMqMwGeQ6Gh5MUAz7ZaBQT8WedxZ')
        .done(function(data) {
          alert('再起動中です。しばらくしてからページを再読み込みしてください。');
        })
        .fail(function() {
          alert('再起動できませんでした。');
        });
    });
  });
</script>

</body>
</html>
