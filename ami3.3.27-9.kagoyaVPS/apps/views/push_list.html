<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>PUSH通知</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- jQuery UI CSS -->
  <link href="/assets/css/jquery-ui.css" rel="stylesheet" />
  <!-- Bootstrap CSS -->
  <link href="/assets/css/bootstrap.css" rel="stylesheet">
  <!-- font icon -->
  <link href="/assets/css/font-awesome.min.css" rel="stylesheet">
  <!-- style -->
  <link href="/assets/css/style.css" rel="stylesheet"/>

  <style>
    #contents {
      margin-top: 10px;
    }
    .token {
      width: 300px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body class="color-dark menu-top">

<header class="navbar">
  <div class="container-fluid">
    <div class="navbar-header">
      <a class="navbar-brand" href="/admin">テレナス</a>
    </div>
  </div>
</header>

<ol class="breadcrumb border-flat" style="margin-bottom: 0;">
  <li><a href="/">メニュー</a></li>
  <li class="active">PUSH通知</li>
</ol>

<div id="contents">

  <div class="page-header" style="margin-top: 0;">
    <div class="container-fluid">
      <div class="row">
        <h4 class="page-header-title" style="margin-top: 5px;">PUSH通知</h4>
      </div>
    </div>
  </div>

  <div class="container-fluid">

    <div class="row">
      <div class="col-xs-12">

        <table class="table table-bordered" style="max-width: 800px;">
          <thead>
          <tr>
            <th style="width: 60px;">No</th>
            <th style="width: 120px;">ユーザーID</th>
            <th style="width: 100px;">グループ</th>
            <th style="width: 320px;">デバイス</th>
            <th style="width: 200px;">タイプ</th>
          </tr>
          </thead>
          <tbody id="tbody1"></tbody>
        </table>

      </div>
    </div>

  </div>

</div>

<div id="modal-push" class="modal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
        <h6 class="modal-title">PUSH通知テスト</h6>
      </div>
      <div class="modal-body">
        <table class="table table-basic table-bordered">
          <tr>
            <th>タイトル</th>
            <td><input type="text" id="modal-push-title" class="form-control" maxlength="20"></td>
          </tr>
          <tr>
            <th>メッセージ<span class="text-danger">*</span></th>
            <td><input type="text" id="modal-push-message" class="form-control" maxlength="40"></td>
          </tr>
        </table>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal">キャンセル</button>
        <button id="modal-push-btn" type="button" class="btn btn-lightblue">送信</button>
      </div>
    </div>
  </div>
</div>

<!-- javascript -->
<script src="/assets/js/jquery.js"></script>
<script src="/assets/js/jquery-ui.min.js"></script>
<script src="/assets/js/bootstrap.js"></script>
<script src="/assets/js/app.js"></script>
<script src="/js/admin/push_list.js"></script>


</body>
</html>
