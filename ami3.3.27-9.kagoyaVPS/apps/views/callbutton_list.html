<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>コールボタン</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- jQuery UI CSS -->
  <link href="/assets/css/jquery-ui.css" rel="stylesheet" />
  <!-- Bootstrap CSS -->
  <link href="/assets/css/bootstrap.css" rel="stylesheet">
  <!-- font icon -->
  <link href="/assets/css/font-awesome.min.css" rel="stylesheet">
  <!-- style -->
  <link href="/assets/css/style.css" rel="stylesheet"/>

  <style>
    #contents {
      margin-top: 10px;
    }
  </style>
</head>
<body class="color-dark menu-top">

<header class="navbar">
  <div class="container-fluid">
    <div class="navbar-header">
      <a class="navbar-brand" href="/admin">テレナス</a>
    </div>
  </div>
</header>

<ol class="breadcrumb border-flat" style="margin-bottom: 0;">
  <li><a href="/">メニュー</a></li>
  <li class="active">コールボタン</li>
</ol>

<div id="contents">

  <div class="page-header" style="margin-top: 0;">
    <div class="container-fluid">
      <div class="row">
        <h4 class="page-header-title" style="margin-top: 5px;">コールボタン</h4>
        <div class="btn-toolbar">
          <div class="btn-group">
            <a id="add-button" class="btn btn-default btn-sm toggle btn-3d">
              登録
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="container-fluid">

    <div class="row">
      <div class="col-xs-12">

        <table class="table table-bordered" style="max-width: 800px;">
          <thead>
          <tr>
            <th>ボタンID</th>
            <th>ルームID</th>
            <th>対象グループ</th>
            <th>名称</th>
          </tr>
          </thead>
          <tbody id="tbody1"></tbody>
        </table>

      </div>
    </div>

  </div>

</div>


<div id="modal-edit" class="modal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
        <h6 class="modal-title">コールボタン登録</h6>
      </div>
      <div class="modal-body">
        <table class="table table-basic table-bordered">
          <tr>
            <th>ボタンID</th>
            <td><input type="text" id="modal-edit-buttonid" class="form-control" maxlength="10"></td>
          </tr>
          <tr>
            <th>ルームID</th>
            <td><input type="text" id="modal-edit-roomid" class="form-control" maxlength="10"></td>
          </tr>
          <tr>
            <th>対象グループ</th>
            <td><input type="text" id="modal-edit-group" class="form-control" maxlength="10"></td>
          </tr>
          <tr>
            <th>名称</th>
            <td><input type="text" id="modal-edit-name" class="form-control" maxlength="10"></td>
          </tr>
        </table>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal">キャンセル</button>
        <button id="modal-edit-btn" type="button" class="btn btn-lightblue">登録</button>
        <button id="modal-edit-delete-btn" type="button" class="btn btn-danger" style="display: none;">削除</button>
      </div>
    </div>
  </div>
</div>

<!-- javascript -->
<script src="/assets/js/jquery.js"></script>
<script src="/assets/js/jquery-ui.min.js"></script>
<script src="/assets/js/bootstrap.js"></script>
<script src="/assets/js/app.js"></script>
<script src="/js/admin/callbutton_list.js"></script>


</body>
</html>
