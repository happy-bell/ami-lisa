// android/settings.gradle  ── Flutter 3.29.x 用 “ほぼデフォルト”

pluginManagement {
    // Flutter SDK パスを local.properties から取得
    def props = new Properties()
    file("local.properties").withInputStream { props.load(it) }
    def flutterSdkPath = props["flutter.sdk"]

    // Flutter の Gradle プラグインを取り込む
    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    // リポジトリ
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}

/* ★ ポイント ── バージョンは **固定値** を直書き ★ */
plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.1.0"
    id "com.android.application"          version "8.5.0"  apply false
    id "org.jetbrains.kotlin.android"     version "1.9.24" apply false
    id "com.google.gms.google-services"   version "4.4.1"  apply false
}

include(":app")
