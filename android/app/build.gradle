plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
    id("com.google.gms.google-services")
    id("dev.flutter.flutter-gradle-plugin")
}

/* ───────── Keystore ──────── */
def keystoreProps = new Properties()
def keystoreFile  = rootProject.file("key.properties")
if (keystoreFile.exists()) keystoreProps.load(new FileInputStream(keystoreFile))

/* ───────── local.properties を “ルート” から読む ──────── */
def localProps = new Properties()
def localFile  = rootProject.file("local.properties")        // ← ここだけ元に戻す
if (localFile.exists()) {
    localFile.withReader("UTF-8") { localProps.load(it) }
}

def flutterVersionCode = (localProps["flutter.versionCode"] ?: "1") as Integer
def flutterVersionName =  localProps["flutter.versionName"] ?: "1.0"

/* ───────── Android 設定 ──────── */
android {
    namespace "jp.amiplus.lisa"

    compileSdk 36
    ndkVersion flutter.ndkVersion

    defaultConfig {
        applicationId "jp.amiplus.lisa"
        minSdk 23
        targetSdk 36
        versionCode flutterVersionCode
        versionName flutterVersionName

        // TV005/TV007 は 32bit 専用。Play の 16KB は 64bit のみ対象。
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-fexceptions"
                arguments "-DANDROID_STL=c++_static",
                        "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    signingConfigs {
        release {
            keyAlias      keystoreProps["keyAlias"]
            keyPassword   keystoreProps["keyPassword"]
            storeFile     keystoreProps["storeFile"] ? file(keystoreProps["storeFile"]) : null
            storePassword keystoreProps["storePassword"]
        }
    }

    buildTypes {
        release { signingConfig signingConfigs.release }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17   // AGP 8.5 要件
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    sourceSets { main.java.srcDirs += "src/main/kotlin" }
}

/* ───────── Flutter プロジェクトへのパス ──────── */
flutter { source "../.." }

/* ───────── 依存関係 ──────── */
// android/app/build.gradle
dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    implementation "com.google.firebase:firebase-messaging"

    // flutter_webrtc の ExternalAudioProcessing にUSBマイクPCMを注入するため、
    // プラグインと同じ libwebrtc をコンパイル時のみ参照 (実行時はプラグイン側を使用)
    compileOnly 'io.github.webrtc-sdk:android:125.6422.03'

    configurations.all {
        exclude module: "assets_audio_player_web"
    }
}

